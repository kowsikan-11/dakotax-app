<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dakotax Milk Collection</title>
<meta name="description" content="Milk collection register for a village collection centre — milk in from suppliers, milk out to customers, advances, payments and reports, kept in a Google Sheet.">
<meta name="theme-color" content="#0b6b5f">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dakotax">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/img/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/img/icon-192.png">
<link rel="stylesheet" href="assets/css/app.css?v=2.0.0">
<script>
  /* Apply the saved appearance and language before the first paint, so a
     phone set to dark never flashes white. */
  (function () {
    try {
      var theme = localStorage.getItem('dakotax.theme');
      if (theme === 'dark' || theme === 'light') document.documentElement.setAttribute('data-theme', theme);
      if (localStorage.getItem('dakotax.lang') === 'ta') document.documentElement.lang = 'ta';
    } catch (err) { /* private mode — the phone's setting still applies */ }
  })();
</script>
</head>
<body>

<!-- First run: no sheet link on this device and none built into the site. -->
<div id="welcome" hidden></div>

<div class="app" id="shell">
  <aside class="rail" id="rail"></aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar__title">
        <h1 id="page-title">Dakotax</h1>
        <p id="page-sub" hidden></p>
      </div>
      <button class="pill" type="button" id="sync-pill"><span class="spinner" aria-hidden="true"></span><span class="pill__text">…</span></button>
      <button class="iconbtn langbtn" type="button" id="lang-toggle"></button>
    </header>
    <main class="content" id="view" tabindex="-1"></main>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="Pages"></nav>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<!-- The sheet link for every phone lives in assets/js/config.local.js. -->
<script src="assets/js/config.local.js?v=2.0.0"></script>
<script src="assets/js/i18n.js?v=2.0.0"></script>
<script src="assets/js/util.js?v=2.0.0"></script>
<script src="assets/js/api.js?v=2.0.0"></script>
<script src="assets/js/charts.js?v=2.0.0"></script>
<script src="assets/js/ui.js?v=2.0.0"></script>
<script src="assets/js/store.js?v=2.0.0"></script>
<script src="assets/js/pages/dashboard.js?v=2.0.0"></script>
<script src="assets/js/pages/entry.js?v=2.0.0"></script>
<script src="assets/js/pages/people.js?v=2.0.0"></script>
<script src="assets/js/pages/money.js?v=2.0.0"></script>
<script src="assets/js/pages/advances.js?v=2.0.0"></script>
<script src="assets/js/pages/reports.js?v=2.0.0"></script>
<script src="assets/js/pages/settings.js?v=2.0.0"></script>
<script src="assets/js/app.js?v=2.0.0"></script>
</body>
</html>
